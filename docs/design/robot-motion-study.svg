<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">BioGym Arena pixel robot motion study</title>
  <desc id="desc">A small pixel robot walks within Protein Sequence, Protein Structure, and Epitope Analysis cells, then enters TransferArena. This loop illustrates motion only and contains no episode results.</desc>
  <defs>
    <pattern id="tiles" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#3c6b83" stroke-opacity=".4"/></pattern>
    <style>
      .label{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#e7f9ff}
      .small{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#9ec3d1;letter-spacing:1px}
      .pixel{shape-rendering:crispEdges}
      @media (prefers-reduced-motion: reduce){.walk,.bob,.blink{animation:none!important}}
    </style>
  </defs>
  <rect width="1200" height="440" fill="#081827"/>
  <rect x="28" y="28" width="1144" height="384" rx="12" fill="#0c2334" stroke="#3a7790" stroke-width="2"/>
  <text x="58" y="72" class="label" font-size="28">BioGym Arena · robot movement study</text>
  <text x="58" y="96" class="small">ILLUSTRATIVE LOOP · FINAL MOTION FOLLOWS RECORDED EPISODE EVENTS</text>
  <g class="pixel">
    <g><rect x="54" y="128" width="240" height="224" fill="#102b3d" stroke="#39d6d1" stroke-width="3"/><rect x="54" y="296" width="240" height="56" fill="url(#tiles)"/><rect x="72" y="145" width="204" height="52" fill="#14384b"/><text x="88" y="166" class="small">ROOM 01</text><text x="88" y="187" class="label">Protein Sequence</text><rect x="93" y="234" width="20" height="20" fill="#35c6c3"/><rect x="123" y="234" width="20" height="20" fill="#35c6c3"/><rect x="153" y="234" width="20" height="20" fill="#35c6c3"/><text x="88" y="338" class="small">SELECT TOOL · VALIDATE</text></g>
    <g><rect x="322" y="128" width="240" height="224" fill="#102b3d" stroke="#50c9ec" stroke-width="3"/><rect x="322" y="296" width="240" height="56" fill="url(#tiles)"/><rect x="340" y="145" width="204" height="52" fill="#14384b"/><text x="356" y="166" class="small">ROOM 02</text><text x="356" y="187" class="label">Protein Structure</text><path d="M391 247h22v-22h22v22h22v-22h22" fill="none" stroke="#50c9ec" stroke-width="6"/><text x="356" y="338" class="small">INSPECT · RECOVER</text></g>
    <g><rect x="590" y="128" width="240" height="224" fill="#102b3d" stroke="#60d4d5" stroke-width="3"/><rect x="590" y="296" width="240" height="56" fill="url(#tiles)"/><rect x="608" y="145" width="204" height="52" fill="#14384b"/><text x="624" y="166" class="small">ROOM 03</text><text x="624" y="187" class="label">Epitope Analysis</text><path d="M665 232l25 21 24-21 25 21" fill="none" stroke="#53d9cf" stroke-width="6"/><text x="624" y="338" class="small">CHECK EVIDENCE</text></g>
    <g><rect x="858" y="128" width="288" height="224" fill="#202846" stroke="#ad8af2" stroke-width="3"/><rect x="858" y="296" width="288" height="56" fill="url(#tiles)"/><rect x="876" y="145" width="252" height="52" fill="#302b53"/><text x="892" y="166" class="small">UNSEEN CHALLENGE</text><text x="892" y="187" class="label">TransferArena</text><path d="M958 248h50m-18-18 18 18-18 18" fill="none" stroke="#c6a6ff" stroke-width="7"/><text x="892" y="338" class="small">EVALUATE TRANSFER</text></g>
    <path d="M58 306H1142" fill="none" stroke="#7cd9e7" stroke-width="4" stroke-dasharray="16 8" opacity=".75"/>
    <g>
      <animateTransform class="walk" attributeName="transform" type="translate" values="76 242;226 242;226 242;344 242;496 242;496 242;612 242;764 242;764 242;884 242;1034 242;1034 242;76 242" keyTimes="0;.12;.20;.28;.40;.48;.56;.68;.76;.84;.96;.99;1" dur="16s" repeatCount="indefinite"/>
      <g>
        <animateTransform class="bob" attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur=".36s" repeatCount="indefinite"/>
        <rect x="4" y="10" width="44" height="38" fill="#071525" stroke="#57e8e2" stroke-width="4"/>
        <rect x="12" y="2" width="28" height="14" fill="#102f42" stroke="#57e8e2" stroke-width="4"/>
        <rect x="21" y="21" width="12" height="12" fill="#7cf9f1"><animate class="blink" attributeName="opacity" values="1;1;.15;1" keyTimes="0;.45;.5;1" dur="3s" repeatCount="indefinite"/></rect>
        <rect x="0" y="20" width="6" height="19" fill="#5ac5cf"/><rect x="46" y="20" width="6" height="19" fill="#5ac5cf"/>
        <rect x="10" y="48" width="10" height="9" fill="#d5eaff"/><rect x="32" y="48" width="10" height="9" fill="#d5eaff"/>
      </g>
    </g>
  </g>
  <text x="58" y="390" class="small">ONE AGENT · ROOM-LOCAL MOVEMENT · RECORDED ACTIONS WILL DRIVE THE PRODUCT VERSION</text>
</svg>
