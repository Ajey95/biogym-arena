[project]
name = "biogym-arena"
version = "0.1.0"
description = "Instrumented bioinformatics agent episodes"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.116,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3", "httpx>=0.27,<1", "torch>=2.2,<3", "mcp>=1.26,<2", "openenv==0.14.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
train = ["trl>=0.26,<1", "transformers>=5,<6", "peft>=0.18,<1", "datasets>=4,<5", "accelerate>=1,<2"]

[tool.setuptools.package-data]
biogym = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
