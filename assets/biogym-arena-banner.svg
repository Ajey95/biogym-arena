<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">BioGym Arena</title>
  <desc id="desc">A luminous track links three scientific laboratory rooms to a transfer arena.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081827"/><stop offset=".56" stop-color="#102a39"/><stop offset="1" stop-color="#0c172b"/></linearGradient>
    <linearGradient id="rail" x2="1"><stop stop-color="#39e3d1"/><stop offset=".55" stop-color="#77a8f8"/><stop offset="1" stop-color="#b890f6"/></linearGradient>
    <linearGradient id="card" x2="1" y2="1"><stop stop-color="#173d4c"/><stop offset="1" stop-color="#18304b"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#74b7be" stroke-opacity=".08"/></pattern>
    <filter id="glow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <circle cx="1120" cy="35" r="180" fill="#46dbc9" opacity=".045"/>
  <circle cx="80" cy="338" r="180" fill="#b08dff" opacity=".055"/>
  <g fill="none" stroke="#63d8d4" stroke-opacity=".18"><path d="M0 70H1200M0 290H1200"/><path d="M42 0V360M1158 0V360"/></g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="68" y="76" fill="#6eebe0" font-size="14" font-weight="700" letter-spacing="5">SCIENTIFIC AGENT LABORATORY</text>
    <text x="65" y="140" fill="#f0f8fb" font-size="61" font-weight="750" letter-spacing="-2">BioGym Arena</text>
    <text x="68" y="178" fill="#a9cad5" font-size="20">Train the workflow. Test the evidence. Trace the result.</text>
  </g>
  <path d="M70 268H1145" stroke="url(#rail)" stroke-width="16" opacity=".36" filter="url(#glow)"/>
  <path d="M70 268H1145" stroke="#294656" stroke-width="26" stroke-linecap="round"/>
  <path d="M70 268H1145" stroke="url(#rail)" stroke-width="4" stroke-linecap="round"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(210 0)"><rect x="-108" y="204" width="216" height="112" rx="17" fill="url(#card)" stroke="#4b9ea4" stroke-opacity=".65"/><text y="239" fill="#6eebe0" font-size="12" letter-spacing="2">ROOM 01</text><text y="263" fill="#edf8fa" font-size="18" font-weight="700">Protein Sequence</text><circle cy="306" r="7" fill="#55e5d4"/></g>
    <g transform="translate(470 0)"><rect x="-108" y="204" width="216" height="112" rx="17" fill="url(#card)" stroke="#6eadd2" stroke-opacity=".65"/><text y="239" fill="#8cd6fb" font-size="12" letter-spacing="2">ROOM 02</text><text y="263" fill="#edf8fa" font-size="18" font-weight="700">Protein Structure</text><circle cy="306" r="7" fill="#89c7ff"/></g>
    <g transform="translate(730 0)"><rect x="-108" y="204" width="216" height="112" rx="17" fill="url(#card)" stroke="#9c88d3" stroke-opacity=".7"/><text y="239" fill="#c5b1ff" font-size="12" letter-spacing="2">ROOM 03</text><text y="263" fill="#edf8fa" font-size="18" font-weight="700">Epitope Analysis</text><circle cy="306" r="7" fill="#bda6ff"/></g>
    <g transform="translate(1000 0)"><rect x="-119" y="197" width="238" height="126" rx="18" fill="#27304e" stroke="#ba9df5" stroke-width="2"/><text y="236" fill="#d2baff" font-size="12" letter-spacing="2">UNSEEN CHALLENGE</text><text y="265" fill="#fff8ff" font-size="21" font-weight="750">TransferArena</text><circle cy="312" r="7" fill="#d3adff"/></g>
  </g>
  <g stroke="#8df3e5" stroke-width="2" fill="none" opacity=".5"><path d="M1047 82l22-18 24 15 22-18M1047 82l23 21 23-24 22 22"/><circle cx="1047" cy="82" r="4" fill="#8df3e5"/><circle cx="1069" cy="64" r="4" fill="#8df3e5"/><circle cx="1093" cy="79" r="4" fill="#8df3e5"/><circle cx="1115" cy="61" r="4" fill="#8df3e5"/></g>
</svg>
